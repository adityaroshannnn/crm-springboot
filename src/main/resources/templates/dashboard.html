<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>

<body>

<div th:replace="~{fragments/layout :: layout(~{::section})}">

<section>

<h3 class="mb-4">Dashboard</h3>

<div class="row">

<div class="col-md-3">
<div class="card shadow-sm p-3">
<h6>Total Customers</h6>
<h3 th:text="${totalCustomers}">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card shadow-sm p-3">
<h6>Total Products</h6>
<h3 th:text="${totalProducts}">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card shadow-sm p-3">
<h6>Total Orders</h6>
<h3 th:text="${totalOrders}">0</h3>
</div>
</div>

<div class="col-md-3">
<div class="card shadow-sm p-3">
<h6>Revenue</h6>
<h3>$0</h3>
</div>
</div>

</div>

</section>

</div>

</body>
</html>
