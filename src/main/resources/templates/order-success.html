<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Order Successful')}"></head>
<body>
<div th:replace="~{fragments/layout :: layout(~{::section})}">
    <section class="py-5" style="min-height: 80vh; display: flex; align-items: center;">
        <div class="container text-center">
            
            <div class="success-animation mb-4 pb-2">
                <div class="checkmark-circle shadow-lg">
                    <div class="background"></div>
                    <div class="checkmark draw"></div>
                </div>
            </div>

            <h1 class="display-5 fw-bold text-success mb-3 animation-fade-up" style="animation-delay: 0.5s;">Order Placed Successfully!</h1>
            <p class="lead text-muted mb-5 animation-fade-up" style="animation-delay: 0.7s; max-width: 600px; margin: 0 auto;">
                Thank you for your purchase. Your order has been confirmed and is being processed. You will receive an email confirmation shortly.
            </p>
            
            <div class="d-flex justify-content-center gap-3 animation-fade-up" style="animation-delay: 0.9s;">
                <a th:href="@{/shop}" class="btn btn-outline-primary btn-lg rounded-pill px-4">
                    <i class="bi bi-cart me-2"></i>Continue Shopping
                </a>
                <a th:href="@{/my-orders}" class="btn btn-primary btn-lg rounded-pill px-4 shadow">
                    <i class="bi bi-box-seam me-2"></i>Track Order
                </a>
            </div>

        </div>

        <style>
            /* CSS Checkmark Animation */
            .success-animation {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .checkmark-circle {
                width: 120px;
                height: 120px;
                position: relative;
                display: inline-block;
                vertical-align: top;
                border-radius: 50%;
                background: #fff;
            }
            .checkmark-circle .background {
                width: 120px;
                height: 120px;
                border-radius: 50%;
                background: linear-gradient(135deg, #28a745, #20c997);
                position: absolute;
                top: 0; left: 0;
            }
            .checkmark-circle .checkmark.draw:after {
                animation-duration: 800ms;
                animation-timing-function: ease;
                animation-name: checkmark;
                transform: scaleX(-1) rotate(135deg);
                animation-delay: 300ms;
                animation-fill-mode: forwards;
            }
            .checkmark-circle .checkmark:after {
                opacity: 0;
                height: 60px;
                width: 25px;
                transform-origin: left top;
                border-right: 6px solid white;
                border-top: 6px solid white;
                content: '';
                left: 30px;
                top: 60px;
                position: absolute;
            }
            @keyframes checkmark {
                0% {
                    height: 0;
                    width: 0;
                    opacity: 1;
                }
                20% {
                    height: 0;
                    width: 25px;
                    opacity: 1;
                }
                100% {
                    height: 60px;
                    width: 25px;
                    opacity: 1;
                }
            }
            .checkmark-circle {
                animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
                transform: scale(0);
            }
            @keyframes popIn {
                0% { transform: scale(0); }
                100% { transform: scale(1); }
            }

            /* Fade Up Animation */
            .animation-fade-up {
                opacity: 0;
                transform: translateY(20px);
                animation: fadeUp 0.6s ease forwards;
            }
            @keyframes fadeUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        </style>
    </section>
</div>
</body>
</html>
